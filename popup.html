<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>PineFetch Link Dump</title>
        <link rel="icon" href="assets/images/logo.png" type="image/png" />
        <link rel="stylesheet" href="vendor/pinefetch.css" />
        <style>
            html,
            body {
                width: 420px;
                min-width: 420px;
                max-width: 420px;
                min-height: 0;
                overflow-x: hidden;
            }

            body {
                margin: 0;
            }

            .pf-popup-shell {
                width: 420px;
                max-width: 420px;
                min-height: 0;
                padding: var(--pf-space-3xl);
            }

            .pf-brand-row {
                flex: 1 1 auto;
                flex-wrap: nowrap;
                align-items: center;
                min-width: 0;
            }

            .pf-popup-header {
                flex-direction: row;
                align-items: center;
            }

            .pf-popup-header > .pf-badge {
                flex: 0 0 auto;
            }

            .pf-popup-header .pf-title {
                font-size: 1.08rem;
                letter-spacing: 0;
            }

            .pf-brand-logo {
                width: 44px;
                height: 44px;
                flex: 0 0 auto;
                object-fit: contain;
                border-radius: var(--pf-radius-md);
            }

            .pf-action-row {
                flex-wrap: nowrap;
            }

            .pf-action-row .pf-btn {
                min-width: 0;
            }

            .pf-view-toggle {
                width: 100%;
            }

            .pf-view-toggle .pf-segmented-btn {
                flex: 1 1 0;
            }

            .pf-view-panel {
                display: grid;
                gap: var(--pf-space-3xl);
            }

            .pf-view-panel[hidden] {
                display: none;
            }

            .pf-footer-row {
                justify-content: space-between;
                flex-wrap: nowrap;
                align-items: center;
            }

            .pf-feedback-panel {
                min-height: 38px;
                padding: var(--pf-space-xl) var(--pf-space-2xl);
                background: var(--pf-panel-muted);
                border: var(--pf-border-width) solid var(--pf-border);
                border-radius: var(--pf-radius-md);
                transition:
                    background-color var(--pf-duration-normal) var(--pf-ease-standard),
                    border-color var(--pf-duration-normal) var(--pf-ease-standard),
                    box-shadow var(--pf-duration-normal) var(--pf-ease-standard);
            }

            .pf-feedback-panel[data-status='success'] {
                background: var(--pf-accent-dim);
                border-color: var(--pf-border-strong);
                box-shadow: var(--pf-shadow-inset-accent);
            }

            .pf-feedback-panel[data-status='warning'] {
                background: var(--pf-warning-dim);
                border-color: var(--pf-warning-border);
            }

            .pf-feedback-panel[data-status='error'] {
                background: var(--pf-danger-dim);
                border-color: var(--pf-danger-border-soft);
            }

            .pf-send-success {
                background: var(--pf-accent-dim);
                border-color: var(--pf-accent);
                color: var(--pf-accent);
                box-shadow: var(--pf-shadow-inset-accent);
            }

            .pf-send-error {
                background: var(--pf-danger-dim);
                border-color: var(--pf-danger);
                color: var(--pf-danger);
                box-shadow: none;
            }

            .pf-footer-row .pf-status {
                min-width: 0;
            }

            .pf-version-label {
                flex: 0 0 auto;
                text-align: right;
            }

            .pf-copy-badge {
                cursor: pointer;
            }

            .pf-copy-badge[aria-disabled='true'] {
                cursor: default;
            }

            .pf-copy-badge:focus-visible {
                outline: 2px solid currentColor;
                outline-offset: 2px;
            }
        </style>
    </head>
    <body>
        <main class="pf-app-shell pf-app-shell-narrow pf-popup-shell">
            <section class="pf-panel" aria-labelledby="pfPopupTitle">
                <header class="pf-panel-header pf-popup-header">
                    <div class="pf-row pf-brand-row">
                        <img
                            class="pf-brand-logo pf-non-select"
                            src="assets/images/logo.png"
                            alt="PineFetch Link Dump logo"
                        />
                        <div class="pf-panel-heading">
                            <h1 class="pf-title pf-non-select" id="pfPopupTitle">PineFetch Link Dump</h1>
                        </div>
                    </div>
                    <span class="pf-badge pf-badge-muted pf-non-select" id="pfStateBadge">Idle</span>
                </header>

                <div class="pf-segmented pf-view-toggle" role="tablist" aria-label="Popup view">
                    <button
                        class="pf-segmented-btn pf-is-active"
                        id="pfSendTab"
                        type="button"
                        role="tab"
                        aria-selected="true"
                        aria-controls="pfSendPanel"
                        data-popup-view="send"
                    >
                        Send
                    </button>
                    <button
                        class="pf-segmented-btn"
                        id="pfSettingsTab"
                        type="button"
                        role="tab"
                        aria-selected="false"
                        aria-controls="pfSettingsPanel"
                        data-popup-view="settings"
                        tabindex="-1"
                    >
                        Settings
                    </button>
                </div>

                <section
                    class="pf-view-panel"
                    id="pfSendPanel"
                    role="tabpanel"
                    aria-labelledby="pfSendTab"
                >
                    <section class="pf-panel-soft pf-stack-sm" aria-label="Detected video links">
                        <header class="pf-toolbar" style="flex-direction: row">
                            <span class="pf-badge pf-badge-muted pf-non-select" id="pfPreviewMode">No links</span>
                            <span class="pf-text pf-non-select">Links: <span id="pfPreviewCount">0</span></span>
                        </header>

                        <div class="pf-stack-sm pf-scroll-area" id="pfPreviewLinks" aria-live="polite">
                            <p class="pf-status">No links found.</p>
                        </div>
                    </section>

                    <div class="pf-row pf-action-row" aria-label="Actions">
                        <button class="pf-btn pf-btn-primary pf-grow pf-non-select" id="pfSendButton" type="button">
                            Send to PineFetch
                        </button>
                        <button class="pf-btn pf-btn-ghost pf-grow pf-non-select" id="pfExportButton" type="button">
                            Export TXT
                        </button>
                    </div>
                </section>

                <section
                    class="pf-view-panel"
                    id="pfSettingsPanel"
                    role="tabpanel"
                    aria-labelledby="pfSettingsTab"
                    hidden
                >
                    <div class="pf-stack-sm" aria-label="PineFetch settings">
                        <label class="pf-field" for="pfEndpointInput">
                            <span class="pf-label pf-non-select">PineFetch Endpoint</span>
                            <input
                                class="pf-input"
                                id="pfEndpointInput"
                                type="url"
                                spellcheck="false"
                                autocomplete="off"
                                inputmode="url"
                                value="http://127.0.1:2255"
                            />
                        </label>

                        <label class="pf-field" for="pfSecretInput">
                            <span class="pf-label pf-non-select">PineFetch Secret</span>
                            <input
                                class="pf-input"
                                id="pfSecretInput"
                                type="password"
                                spellcheck="false"
                                autocomplete="off"
                            />
                        </label>
                    </div>

                    <p class="pf-hint">Settings are saved automatically.</p>
                </section>

                <footer class="pf-row pf-footer-row pf-feedback-panel pf-non-select" id="pfFeedbackPanel">
                    <p class="pf-status pf-grow" id="pfStatusMessage" role="status" aria-live="polite">Ready.</p>
                    <span class="pf-status pf-version-label" id="pfVersionLabel" aria-label="Extension version"></span>
                </footer>
            </section>
        </main>

        <script src="providers/youtube.js" defer></script>
        <script src="providers/tiktok.js" defer></script>
        <script src="providers/instagram.js" defer></script>
        <script src="providers/standard-video.js" defer></script>
        <script src="popup.js" defer></script>
    </body>
</html>
